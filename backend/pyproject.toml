[project]
name = "chart-analyser-backend"
version = "0.1.0"
description = "Personal Chart Analyser backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "numpy>=2.5.3",
    "protobuf==7.36.2",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
